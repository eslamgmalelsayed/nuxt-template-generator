name: Quality

# Lint + format + build gate. (The old Lighthouse/SSG audit was dropped: the app
# is SSR now, and this repo is a headless dashboard harness, so a static
# Lighthouse run doesn't apply. A proper SSR Lighthouse job can live in the
# client sites, which are the real marketing pages.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
